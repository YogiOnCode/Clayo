<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="clayo-page" content="1">
<title>Every layout</title>
<link rel="stylesheet" href="clayo-page.css">
</head><body>
<main class="deck">
  <section class="slide title"><h1>Every layout</h1><p class="lead">One slide of each kind.</p></section>
  <section class="slide section"><h2>A part</h2><p class="lead">What it shows.</p></section>
  <section class="slide"><h2>Bullets</h2><ul><li>one</li><li>two</li><li>three</li><li>four</li></ul></section>
  <section class="slide three"><h2>Three</h2>
    <div><h3>First</h3><p>One line.</p></div><div><h3>Second</h3><p>One line.</p></div><div><h3>Third</h3><p>One line.</p></div>
  </section>
  <section class="slide split"><div><h2>Left</h2><p>Text.</p></div>
    <div class="kpis"><div class="kpi good"><b>98%</b><span>passed</span></div><div class="kpi bad"><b>4</b><span>failed</span></div></div>
  </section>
  <section class="slide closing"><h2>The end</h2><p class="lead">What happens next.</p></section>
</main>
<script src="clayo-page.js"></script>
</body></html>
