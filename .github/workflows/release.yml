# Pushing a v* tag builds the release zip on GitHub, attests where it was built, and puts the
# zip and its .sha256 on a draft release for that tag. Check the draft, write the notes, publish.
# Anyone can then check a download: gh attestation verify <zip> --repo YogiOnCode/Clayo
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write       # the draft release
  id-token: write       # signing the attestation
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      # Actions are pinned to a commit, as a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # main's history, for the check below
          persist-credentials: false

      # Only reviewed code ships: a tag pushed on any other branch builds nothing.
      - name: The tag is on main
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "$env:GITHUB_REF_NAME is not on main" }

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build the zip
        shell: pwsh
        run: ./scripts/publish.ps1

      - name: The tag matches the version
        shell: pwsh
        run: |
          $zip = Get-ChildItem publish/clayo-*-win-x64.zip
          if ($zip.Name -ne "clayo-$($env:GITHUB_REF_NAME.TrimStart('v'))-win-x64.zip") {
            throw "$($zip.Name) does not match the tag $env:GITHUB_REF_NAME"
          }

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: publish/clayo-*-win-x64.zip

      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME --draft --verify-tag --title "Clayo $($env:GITHUB_REF_NAME.TrimStart('v'))" `
            (Get-ChildItem publish/clayo-*-win-x64.zip).FullName (Get-ChildItem publish/clayo-*-win-x64.zip.sha256).FullName
