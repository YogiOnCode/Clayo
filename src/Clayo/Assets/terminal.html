<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>terminal</title>

<!-- Vendored in Assets/xterm. No network at runtime. -->
<link rel="stylesheet" href="xterm/xterm.css">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #14171c;
  }
  body { display: flex; position: relative; }
  #term {
    height: 100%;
    flex: 1;
    min-width: 0;
    padding: 10px 4px 6px 12px;
    box-sizing: border-box;
  }

  /* The doc viewer: beside the terminal (split), or over it (full) so the terminal keeps its size. */
  #md { display: none; flex-direction: column; background: #14171c; border-left: 1px solid #262c35; }
  #md.split { display: flex; flex: 0 0 50%; min-width: 0; position: relative; }
  /* Drag to resize the split. Over the border, wider than it looks. */
  #mdgrip { display: none; position: absolute; left: -4px; top: 0; bottom: 0; width: 8px; cursor: col-resize; z-index: 6; }
  #md.split #mdgrip { display: block; }
  #mdgrip:hover, #mdgrip.drag { background: linear-gradient(to right, transparent 3px, #d4a24c 3px, #d4a24c 5px, transparent 5px); }
  body.dragging, body.dragging * { cursor: col-resize !important; user-select: none; }
  body.dragging iframe { pointer-events: none; }
  #md.full { display: flex; position: absolute; inset: 0; z-index: 5; border-left: 0; }
  #md .bar { display: flex; align-items: center; gap: 4px; padding: 6px 8px 6px 14px;
             border-bottom: 1px solid #262c35; font: 12px "Segoe UI", sans-serif; color: #7a828f; }
  #md .bar span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #md button { background: transparent; border: 1px solid #262c35; border-radius: 4px; color: #7a828f;
               font: inherit; padding: 2px 8px; cursor: pointer; }
  #md button:hover { background: #222731; color: #c8cdd6; }
  #md button.on { color: #d4a24c; }
  #md iframe { flex: 1; width: 100%; border: 0; background: #14171c; }
</style>
</head>
<body>
<div id="term"></div>
<div id="md">
  <div id="mdgrip" title="Drag to resize"></div>
  <div class="bar">
    <span id="mdname"></span>
    <button id="mdsplit" title="Half and half">◧ Split</button>
    <button id="mdfull" title="Fill the pane">⛶ Full</button>
    <button id="mdclose" title="Back to the terminal">✕</button>
  </div>
  <!-- No allow-scripts: nothing in a doc can run. Same origin only so the page can keep the
       scroll position and send links to the browser. -->
  <iframe id="mdframe" sandbox="allow-same-origin"></iframe>
</div>

<script src="xterm/xterm.js"></script>
<script src="xterm/addon-fit.js"></script>
<script src="xterm/addon-webgl.js"></script>
<!-- Vendored in Assets/markdown. -->
<script src="markdown/marked.min.js"></script>

<script>
(function () {
  "use strict";

  const host = window.chrome && window.chrome.webview;

  const term = new Terminal({
    fontFamily: '"Cascadia Code", "Cascadia Mono", Consolas, monospace',
    fontSize: 13,
    lineHeight: 1.25,
    letterSpacing: 0,
    cursorBlink: true,
    cursorStyle: "bar",
    // 20000 lines cost ~29 MB of buffer per pane at this width. Claude Code's own
    // transcript is the durable record — this only needs to cover live scrollback.
    scrollback: 5000,
    // A link in the output (OSC 8) opens in your browser, after asking, as xterm's own does.
    // xterm's own opens a window inside the WebView, which Clayo does not allow.
    linkHandler: {
      activate: function (e, uri) {
        if (confirm("Open this link in your browser?\n\n" + uri)) send({ t: "link", d: uri });
      }
    },
    // Claude Code paints its own colours; this palette only fills the gaps.
    theme: {
      background: "#14171c",
      foreground: "#c8cdd6",
      cursor: "#d4a24c",
      cursorAccent: "#14171c",
      selectionBackground: "#2f3947",
      black: "#14171c",
      brightBlack: "#5a6472",
      // xterm 6 draws its own scrollbar, so it is styled here rather than in CSS.
      scrollbarSliderBackground: "#333a45",
      scrollbarSliderHoverBackground: "#464f5d",
      scrollbarSliderActiveBackground: "#464f5d"
    }
  });

  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById("term"));

  // The default DOM renderer is slow enough that Claude Code's full-screen redraws
  // show half-painted frames. WebGL paints a frame in one go. If the GPU context is
  // lost, dropping the addon falls back to the DOM renderer instead of a blank pane.
  try {
    const webgl = new WebglAddon.WebglAddon();
    webgl.onContextLoss(function () { webgl.dispose(); });
    term.loadAddon(webgl);
  } catch (_) { /* no WebGL: DOM renderer */ }

  // --- base64 <-> bytes -------------------------------------------------
  // Raw bytes cross the bridge, never decoded text. A PTY read can split a
  // UTF-8 character or an escape sequence in half; xterm reassembles them.

  function toBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function toBase64(bytes) {
    let bin = "";
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(bin);
  }

  const encoder = new TextEncoder();

  function send(msg) {
    if (host) host.postMessage(JSON.stringify(msg));
  }

  // --- host -> terminal -------------------------------------------------

  if (host) {
    host.addEventListener("message", function (e) {
      let msg;
      try { msg = JSON.parse(e.data); } catch (_) { return; }

      switch (msg.t) {
        case "o":                       // output bytes
          term.write(toBytes(msg.d));
          break;
        case "focus":
          term.focus();
          break;
        case "notice":                  // host-side message, e.g. process exit
          term.writeln("\r\n\x1b[38;5;244m" + msg.d + "\x1b[0m");
          break;
        case "md":                      // show a doc, or show it again after it changed
          showDoc(msg.name, msg.d);
          break;
        case "mdclose":
          closeDoc(false);
          break;
      }
    });
  }

  // --- image tags -------------------------------------------------------
  // The [Image #n] tags on the bottom screen, where the prompt is, for the image chip: an image
  // whose tag you deleted from the prompt drops out of it. Not the screen you scrolled back to,
  // or scrolling would empty the chip. Read after output settles, and sent only when they change.

  let lastTags = null, tagTimer = null;

  function sendTags() {
    tagTimer = null;
    const buf = term.buffer.active;
    const seen = new Set();
    for (let y = 0; y < term.rows; y++) {
      const line = buf.getLine(buf.baseY + y);
      if (!line) continue;
      const re = /\[Image #(\d+)\]/g;
      const text = line.translateToString(true);
      let m;
      while ((m = re.exec(text))) seen.add(+m[1]);
    }
    const tags = Array.from(seen).sort(function (a, b) { return a - b; }).join(",");
    if (tags !== lastTags) {
      lastTags = tags;
      send({ t: "tags", d: tags });
    }
  }

  function queueTags() {
    if (!tagTimer) tagTimer = setTimeout(sendTags, 250);
  }

  term.onWriteParsed(queueTags);

  // --- doc viewer -------------------------------------------------------

  const md = document.getElementById("md");
  const mdFrame = document.getElementById("mdframe");
  const mdName = document.getElementById("mdname");
  const mdSplit = document.getElementById("mdsplit");
  const mdFull = document.getElementById("mdfull");

  // Remote images may load; nothing else leaves the frame.
  const DOC_HEAD =
    '<!DOCTYPE html><meta charset="utf-8">' +
    '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; style-src \'unsafe-inline\'; img-src https: data:">' +
    "<style>" +
    "body{margin:0;padding:18px 24px 40px;background:#14171c;color:#c8cdd6;font:14px/1.6 'Segoe UI',sans-serif}" +
    "h1,h2,h3,h4{color:#eceef1;line-height:1.3;margin:1.4em 0 .5em}h1,h2{border-bottom:1px solid #262c35;padding-bottom:.3em}" +
    "a{color:#d4a24c}code{font:12.5px 'Cascadia Code',Consolas,monospace;background:#1b1f26;padding:.1em .35em;border-radius:3px}" +
    "pre{background:#1b1f26;padding:10px 12px;border-radius:4px;overflow:auto}pre code{padding:0;background:none}" +
    "blockquote{margin:0;padding-left:12px;border-left:3px solid #333a45;color:#7a828f}" +
    "table{border-collapse:collapse}th,td{border:1px solid #262c35;padding:4px 10px}img{max-width:100%}hr{border:0;border-top:1px solid #262c35}" +
    "</style>";

  function escapeHtml(s) {
    return s.replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; });
  }

  function setMode(mode) {
    md.className = mode;
    mdSplit.classList.toggle("on", mode === "split");
    mdFull.classList.toggle("on", mode === "full");
  }

  function showDoc(name, text) {
    // The same doc again keeps its place; a different one starts at the top.
    const doc = mdFrame.contentDocument;
    const y = name === mdName.textContent && doc && doc.scrollingElement ? doc.scrollingElement.scrollTop : 0;
    mdName.textContent = name;
    if (!md.className) setMode("split");
    const body = window.marked ? marked.parse(text) : "<pre>" + escapeHtml(text) + "</pre>";
    mdFrame.onload = function () {
      const d = mdFrame.contentDocument;
      if (!d) return;
      if (d.scrollingElement) d.scrollingElement.scrollTop = y;
      // Web links open in your browser, after asking, as the terminal's do.
      d.addEventListener("click", function (e) {
        const a = e.target.closest && e.target.closest("a[href]");
        if (!a) return;
        e.preventDefault();
        if (/^https?:/i.test(a.href) && confirm("Open this link in your browser?\n\n" + a.href)) send({ t: "link", d: a.href });
      });
    };
    mdFrame.srcdoc = DOC_HEAD + body;
  }

  function closeDoc(tellHost) {
    setMode("");
    mdName.textContent = "";
    mdFrame.srcdoc = "";
    if (tellHost) send({ t: "mdclosed" });
    term.focus();
  }

  // Dragging the grip sets the doc's share of the width, kept for the next time it opens. The
  // terminal follows through the ResizeObserver below, which already coalesces the resizes.
  const grip = document.getElementById("mdgrip");
  grip.addEventListener("pointerdown", function (e) {
    grip.setPointerCapture(e.pointerId);
    grip.classList.add("drag");
    document.body.classList.add("dragging");
  });
  grip.addEventListener("pointermove", function (e) {
    if (!grip.hasPointerCapture(e.pointerId)) return;
    const share = (window.innerWidth - e.clientX) / window.innerWidth * 100;
    md.style.flexBasis = Math.min(80, Math.max(20, share)) + "%";
  });
  grip.addEventListener("lostpointercapture", function () {
    grip.classList.remove("drag");
    document.body.classList.remove("dragging");
  });

  mdSplit.addEventListener("click", function () { setMode("split"); });
  mdFull.addEventListener("click", function () { setMode("full"); });
  document.getElementById("mdclose").addEventListener("click", function () { closeDoc(true); });

  // --- terminal -> host -------------------------------------------------

  term.onData(function (data) {
    send({ t: "i", d: toBase64(encoder.encode(data)) });
  });

  // Mouse reporting, bracketed paste and friends come through onBinary.
  term.onBinary(function (data) {
    const bytes = new Uint8Array(data.length);
    for (let i = 0; i < data.length; i++) bytes[i] = data.charCodeAt(i) & 255;
    send({ t: "i", d: toBase64(bytes) });
  });

  let lastCols = 0, lastRows = 0;

  function doFit() {
    try { fit.fit(); } catch (_) { return; }
    if (term.cols !== lastCols || term.rows !== lastRows) {
      lastCols = term.cols;
      lastRows = term.rows;
      send({ t: "r", cols: term.cols, rows: term.rows });
    }
  }

  // Coalesce resizes: dragging the splitter otherwise fires ResizePseudoConsole
  // dozens of times a second and the TUI redraws garbage.
  let resizeTimer = null;
  const ro = new ResizeObserver(function () {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(doFit, 60);
  });
  ro.observe(document.getElementById("term"));

  window.addEventListener("load", function () {
    doFit();
    term.focus();
    send({ t: "ready", cols: term.cols, rows: term.rows });
  });

  // Copy and paste.
  //
  // Left to xterm's own key handling, Ctrl+C is the child's interrupt (^C) and
  // Ctrl+V a bare ^V, and both cancel the DOM event -- so Ctrl+C threw away
  // whatever you had typed in Claude Code and yanked the viewport back to the
  // prompt, and Ctrl+V never reached the clipboard.
  //
  // Copy has to be done by hand. The selection here is the terminal's own, not a
  // DOM one -- xterm's hidden textarea stays empty on Windows -- and Chromium
  // only raises a copy event when the focused field has a real selection, so
  // there is no native copy to fall back on. Paste is the opposite: let the
  // browser do it, because xterm's own paste handler wraps the text in bracketed
  // paste, and a multi-line paste then arrives as one block instead of a line
  // per Enter. Ctrl+C only interrupts when nothing is selected, which is how
  // Windows Terminal and VS Code behave; the Ctrl+Shift+ variants come here too.
  term.attachCustomKeyEventHandler(function (ev) {
    if (ev.type !== "keydown" || !ev.ctrlKey || ev.altKey || ev.metaKey) return true;
    if (ev.code === "KeyC" && term.hasSelection()) {
      navigator.clipboard.writeText(term.getSelection());
      // Dropped so the next Ctrl+C interrupts rather than copying the same thing.
      term.clearSelection();
      return false;
    }
    if (ev.code === "KeyV") {
      // A file copied in Explorer sits on the clipboard as a file, never as text, so
      // the browser's paste inserts nothing at all. Only the host can see the paths --
      // a pasted File has a name and nothing else -- so ask it, and it types them in
      // the way Windows Terminal pastes a copied file. A text paste still belongs to
      // the browser: the host answers with nothing when the clipboard holds text.
      send({ t: "paste" });
      return false;
    }
    return true;
  });
})();
</script>
</body>
</html>
